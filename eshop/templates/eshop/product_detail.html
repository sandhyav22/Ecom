{% extends "eshop/base.html" %}
{% load static %}

{% block content %}

<style>
.product-detail-container {
    max-width: 1200px;
    margin: 50px auto;
    padding: 20px;
}

.product-detail-box {
    display: flex;
    gap: 60px;
    align-items: center;
}

.product-left {
    flex: 1;
    text-align: center;
}

.product-left img.main-image {
    width: 360px;
    height: 460px;
    object-fit: cover;
    border-radius: 50px;
    box-shadow: 0 8px 15px rgba(0,0,0,0.2);
}

.product-right {
    flex: 1;
}

.product-title {
    font-size: 42px;
    font-weight: bold;
    margin-bottom: 20px;
}

.product-description-title {
    font-size: 24px;
    font-weight: bold;
    margin-bottom: 15px;
}

.product-description {
    font-size: 18px;
    line-height: 1.7;
    color: #222;
    margin-bottom: 30px;
}

.gallery-row {
    display: flex;
    gap: 15px;
    margin-bottom: 25px;
}

.gallery-row img {
    width: 70px;
    height: 70px;
    border-radius: 50%;
    border: 2px solid #ddd;
    cursor: pointer;
    object-fit: cover;
}

.size-section {
    font-size: 20px;
    margin-bottom: 35px;
}

.size-btn {
    border: 2px solid black;
    border-radius: 10px;
    padding: 8px 12px;
    margin-right: 10px;
    cursor: pointer;
    display: inline-block;
}

.action-buttons {
    display: flex;
    gap: 20px;
    align-items: center;
}

.cart-icon-btn {
    font-size: 35px;
    border: none;
    background: none;
    cursor: pointer;
}

.add-cart-btn {
    padding: 15px 35px;
    border: 2px solid black;
    border-radius: 15px;
    background: white;
    font-size: 22px;
    cursor: pointer;
}

.buy-btn {
    padding: 15px 35px;
    border: none;
    border-radius: 15px;
    background: #00c51a;
    color: white;
    font-size: 22px;
    cursor: pointer;
}

@media(max-width:900px){
    .product-detail-box{
        flex-direction: column;
        text-align:center;
    }
}
</style>

<div class="product-detail-container">
    <div class="product-detail-box">

        <!-- Left Side Image -->
        <div class="product-left">
            <img src="{{ product.image.url }}" alt="{{ product.name }}" class="main-image" id="mainProductImage">
        </div>

        <!-- Right Side Content -->
        <div class="product-right">

            <div class="product-title">
                {{ product.name }}
            </div>

            <div class="product-description-title">
                Description:
            </div>

            <div class="product-description">
                {{ product.description }}
            </div>

            <!-- Gallery -->
            <div class="gallery-row">
                {% for img in gallery_images %}
                    <img src="{{ img.image.url }}" onclick="changeImage(this.src)">
                {% endfor %}
            </div>

            <!-- Sizes -->
            <div class="size-section">
                Size :
                <span class="size-btn">XL</span>
                <span class="size-btn">L</span>
                <span class="size-btn">M</span>
                <span class="size-btn">S</span>
            </div>

            <!-- Buttons -->
            <div class="action-buttons">
                <button class="cart-icon-btn">🛒</button>
                <button class="add-cart-btn">Addcart+</button>
                <button class="buy-btn">Buy Now</button>
            </div>

        </div>
    </div>
</div>

<script>
function changeImage(src){
    document.getElementById("mainProductImage").src = src;
}
</script>

{% endblock %}
